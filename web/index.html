<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Krita Web</title>
  <!-- Start the engine downloads while the page's own scripts load (they ask for the same files later). -->
  <link rel="preload" href="engine/kritaengine.js" as="script">
  <link rel="preload" href="engine/kritaengine.wasm" as="fetch" crossorigin>
  <link rel="preload" href="engine/kritaengine.data" as="fetch" crossorigin>
  <link rel="preload" href="engine/resource-cache/manifest.json" as="fetch" crossorigin>
  <link rel="preload" href="engine/resource-cache/resourcecache.sqlite" as="fetch" crossorigin>
  <style>
    body { margin: 0; background: #2b2b2b; }
    /* Shown until the engine has started (removed in main.tsx); plain CSS so it appears before any script loads. */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
            color: #dedede; font: 15px sans-serif; }
    #boot i { width: 36px; height: 36px; border: 3px solid #555; border-top-color: #3daee9; border-radius: 50%; animation: boot 0.9s linear infinite; }
    @keyframes boot { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot i { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="boot" role="status"><i></i>Loading Krita</div>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
